<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reverse Solver</title>

<!-- ======================================================================
     Ayarlar config.js dosyasinda. Orayi doldurmadan da oyun calisir,
     sadece sonuclari gondermez.
     ====================================================================== -->
<script>
  window.SUPABASE_URL = "";
  window.SUPABASE_KEY = "";
</script>
<script src="config.js"></script>
<!-- ===================================================================== -->

<style>
  :root{
    --bg:#16484d; --bg-deep:#0e3236;
    --slot:rgba(255,255,255,.10);
    --text:#eaf3f2; --muted:#8fb2b3;
    --amber:#f0a742; --coral:#e8674c;
    --pill:rgba(255,255,255,.10); --pill-b:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:linear-gradient(178deg,#1c565c 0%,#123c42 46%,#0a2226 100%);
    color:var(--text);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select:none;touch-action:none;
  }
  /* One key light from upper left, echoed by every surface below. */
  .orbs,.grain,.vig{position:fixed;inset:0;pointer-events:none}
  .orbs{filter:blur(58px);opacity:.5}
  .orbs i{position:absolute;border-radius:50%}
  .orbs i:nth-child(1){width:56vw;height:56vw;left:-16vw;top:-12vw;background:#e0564a;opacity:.34}
  .orbs i:nth-child(2){width:52vw;height:52vw;right:-18vw;top:22vh;background:#5f9fc9;opacity:.30}
  .orbs i:nth-child(3){width:60vw;height:60vw;left:-8vw;bottom:-18vh;background:#9179c2;opacity:.26}
  .grain{opacity:.055;mix-blend-mode:overlay}
  .vig{background:radial-gradient(120% 85% at 50% 32%,transparent 45%,rgba(4,16,18,.72) 100%)}
  .strip,.stage,.prompt,.bar{position:relative;z-index:2}

  /* ---------------- top strip ---------------- */
  .strip{display:flex;align-items:center;gap:9px;padding:10px 13px 6px}
  .avatar{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(180deg,#ffd873,#f0a742);
    border:3px solid rgba(255,255,255,.92);
    box-shadow:0 3px 9px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center}
  .avatar svg{width:32px;height:32px}
  .pill{flex:1;height:46px;border-radius:23px;
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border:2px solid var(--pill-b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 8px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;gap:8px;
    backdrop-filter:blur(7px)}
  .pill.tight{flex:0 0 118px}
  .pill svg{width:24px;height:24px;flex:0 0 auto}
  .pill b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .pill b.warn{color:#ffb4a6}
  .reset{flex:0 0 auto;width:46px;height:46px;border-radius:23px;background:var(--pill);
    border:2px solid var(--pill-b);color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .reset svg{width:21px;height:21px}

  /* ---------------- board ---------------- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
  .tray{position:relative;padding:18px;border-radius:20px;
    background:linear-gradient(180deg,#0f3339,#0a262b);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.10),
      inset 0 -2px 0 rgba(0,0,0,.45),
      inset 0 8px 22px rgba(0,0,0,.55),
      0 22px 44px rgba(3,14,16,.6),
      0 2px 0 rgba(255,255,255,.06);
  }
  .board{position:relative;border-radius:10px;touch-action:none}
  .wall{position:absolute;border-radius:3px;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(45deg,#d9412f 0 9px,#f6efe6 9px 18px);
    box-shadow:0 0 0 2px #7d1f16, 0 3px 8px rgba(0,0,0,.55)}
  .slot{position:absolute;border-radius:4px;
    background:rgba(4,20,23,.42);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.05)}

  .pc{position:absolute;left:0;top:0;width:100%;height:100%;
    pointer-events:none;will-change:transform}
  .cw{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;z-index:1}
  .chain{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  .chain circle:nth-last-child(-n+4){pointer-events:auto;cursor:grab}
  .cw svg{display:block;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.42))}
  .pc.lift{z-index:6}
  .pc.chained{z-index:4}
  .pc.lift .cw svg{filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));transform:scale(1.05)}
  .cw svg{transition:transform .16s ease}
  .pc.deal{animation:deal .34s cubic-bezier(.2,.9,.3,1.15) backwards}
  @keyframes deal{from{opacity:0;transform:scale(.72) translateY(-8px)}
                  to{opacity:1;transform:scale(1) translateY(0)}}
  .pc.snap{transition:transform .22s cubic-bezier(.34,1.4,.5,1)}
  .pc.fly{transition:transform .3s cubic-bezier(.3,0,.6,1),opacity .3s ease;opacity:0}
  .pc.blocker .cw svg{filter:drop-shadow(0 0 7px var(--coral)) drop-shadow(0 2px 3px rgba(0,0,0,.32))}
  .pc.target .cw svg{filter:drop-shadow(0 0 10px rgba(240,167,66,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.32))}

  .nail{position:absolute;border-radius:50%;z-index:7;pointer-events:none;
    background:radial-gradient(60% 50% at 32% 26%,#f2f5f8,#8d9aa6 60%,#5b6874);
    box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center}
  .nail span{font-size:13px;font-weight:800;color:#1d2b31;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .pc.pinned .cw svg{filter:grayscale(.55) brightness(.82) drop-shadow(0 2px 4px rgba(0,0,0,.42))}
  .pc.popped .cw svg{animation:popped .5s ease}
  @keyframes popped{0%{filter:brightness(1.9) drop-shadow(0 0 12px var(--amber))}
                    100%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.42))}}
  .nail.tick{animation:nailtick .32s cubic-bezier(.3,1.5,.5,1)}
  @keyframes nailtick{0%{transform:scale(1.45)}100%{transform:scale(1)}}
  .bomb{position:absolute;border-radius:50%;z-index:7;pointer-events:none;
    background:radial-gradient(58% 48% at 32% 26%,#6c7a84,#232f36 62%,#111a1f);
    box-shadow:0 0 0 2px #0c1418,0 3px 6px rgba(0,0,0,.6),0 0 14px rgba(226,74,60,.55);
    display:flex;align-items:center;justify-content:center}
  .bomb span{font-size:14px;font-weight:800;color:#ffd9d2;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
  .bomb i{position:absolute;top:-22%;left:52%;width:16%;height:34%;
    background:linear-gradient(#ffd76a,#e2604f);border-radius:3px;
    transform:rotate(18deg);box-shadow:0 0 9px #ffb03a}
  .bomb.hot{animation:fuse .7s ease-in-out infinite}
  @keyframes fuse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  .bomb.tick{animation:nailtick .32s cubic-bezier(.3,1.5,.5,1)}
  .pc.clang{animation:clang .3s ease}
  @keyframes clang{0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,0)}60%{transform:translate(3px,0)}}

  .sel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0 4px}
  .sel{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;color:var(--text);
    font-variant-numeric:tabular-nums;cursor:pointer}
  .sel.done{background:rgba(240,167,66,.18);border-color:rgba(240,167,66,.5);color:var(--amber)}
  .sel.now{outline:2px solid var(--amber);outline-offset:1px}
  .lvbadge{font-size:9px;letter-spacing:.14em;color:#5a3c06;font-weight:700;
    text-transform:uppercase;line-height:1}
  .lvnum{font-size:20px;font-weight:800;color:#3a2704;line-height:1;
    font-variant-numeric:tabular-nums}
  .avatar{flex-direction:column;gap:1px}
  .stars{display:flex;gap:9px;justify-content:center;margin:4px 0 12px}
  .stars svg{width:32px;height:32px}
  .stars .off{opacity:.2}
  .joint{position:absolute;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 3px rgba(240,167,66,.3);z-index:6;cursor:pointer;
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

  .tut{position:absolute;pointer-events:none;z-index:8}
  .tut-arrow,.tut-hand{position:absolute;animation:nudge 1.5s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translate(0,0);opacity:.75}
                   45%{transform:translate(var(--nx),var(--ny));opacity:1}}

  /* ---------------- boosters ---------------- */
  .prompt{text-align:center;font-size:12.5px;color:var(--amber);min-height:17px;
    padding:0 20px;font-weight:600}
  .bar{display:flex;justify-content:center;gap:13px;padding:7px 14px 14px}
  .bst{position:relative;width:60px;height:60px;border-radius:16px;border:none;
    background:
      radial-gradient(64% 46% at 28% 16%, rgba(255,255,255,.62), rgba(255,255,255,0) 70%),
      linear-gradient(180deg,#6ecbf5,#2b86cf);
    box-shadow:0 0 0 3px rgba(255,255,255,.92),0 6px 13px rgba(0,0,0,.42),
               inset 0 -3px 6px rgba(0,0,0,.22);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:inherit;transition:transform .12s ease}
  .bst:active{transform:scale(.93)}
  .bst svg{width:33px;height:33px}
  .bst .badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:50%;
    background:linear-gradient(180deg,#63c2ef,#2f8fd6);box-shadow:0 0 0 3px rgba(255,255,255,.92);
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .bst.on{background:linear-gradient(180deg,#ffc866,#f0a742);
    box-shadow:0 0 0 3px #fff,0 0 17px rgba(240,167,66,.8)}
  .bst.out{filter:grayscale(.85) brightness(.72);cursor:default}
  .bst-wrap{display:flex;flex-direction:column;align-items:center}
  .bst-name{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin-top:5px;font-weight:600}

  /* ---------------- overlays ---------------- */
  .veil{position:fixed;inset:0;background:rgba(8,32,34,.9);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;padding:26px;z-index:20}
  .veil.open{display:flex}
  .card{max-width:340px;width:100%;max-height:80vh;overflow:auto;background:#14484c;border:1px solid rgba(255,255,255,.16);
    border-radius:18px;padding:24px 22px 18px;text-align:center}
  .card .ic{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;
    background:linear-gradient(180deg,#63c2ef,#2f8fd6);
    box-shadow:0 0 0 3px rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
  .card .ic svg{width:30px;height:30px}
  .card h2{font-size:20px;margin-bottom:6px}
  .card p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:18px}
  .card pre{font-size:10px;text-align:left;background:rgba(0,0,0,.35);padding:10px;
    border-radius:9px;overflow:auto;max-height:180px;margin-bottom:12px;
    white-space:pre;color:#cfe6e5}
  .btn{width:100%;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;
    background:var(--amber);color:#33220a;font-family:inherit;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--muted);
    border:1px solid rgba(255,255,255,.22);margin-top:8px;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<script>
/* ===========================================================================
   Reverse Solver

   Each piece is a jigsaw tile: one cell, with a tab, a hollow or a flat edge
   on each side. You drag it out; it moves only while nothing catches.

   Blocked when, at any position along the travel axis (home cell included):
     - the next cell is occupied, or
     - a cell beside the travel axis is occupied and the two facing edges
       catch. Only hollow against hollow slides past; a tab always catches.

   A boundary is one of three things, and this is the density dial:
       +1 / -1  one side owns the tab -> the pair is interlocked
        0        hollow on both sides -> touching but free to slide past

   That is why a fully packed board still comes apart. Levels are built by
   peeling a full board and forcing open only the joints a move has to shear
   past, so every cell is used and the level is solvable by construction.
   =========================================================================== */

/* ===========================================================================
   Playtest recording

   Every attempt is written down: which level, how many tries it took, how
   long it ran, how it ended, how many times the player yanked a stuck piece,
   and which boosters were spent. That is the data the difficulty table gets
   calibrated against.

   Nothing is sent anywhere by default. Results sit on the device until the
   player taps "Sonuçları gönder". Fill TELEMETRY in below and they also post
   automatically.
   ========================================================================= */
/* Set at the very top of the file so it is the first thing you see when the
   file opens. Blank means results stay on the device and can still be shared
   by hand from the level list. */
const SUPABASE_URL = window.SUPABASE_URL || '';
const SUPABASE_KEY = window.SUPABASE_KEY || '';

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(_){} }
};

const LOG = {
  player: store.get('up_player') || '',
  sid: store.get('up_sid') || (Math.random().toString(36).slice(2,10)),
  rows: JSON.parse(store.get('up_rows') || '[]'),
  tries: JSON.parse(store.get('up_tries') || '{}'),
  queue: JSON.parse(store.get('up_queue') || '[]'),

  save(){
    store.set('up_sid', this.sid);
    store.set('up_player', this.player);
    store.set('up_rows', JSON.stringify(this.rows));
    store.set('up_tries', JSON.stringify(this.tries));
    store.set('up_queue', JSON.stringify(this.queue));
  },

  attempt(lv){ return (this.tries[lv] || 0) + 1; },

  record(row){
    row.p = this.player; row.s = this.sid; row.t = Date.now();
    this.tries[row.lv] = row.try;
    this.rows.push(row);
    this.queue.push({
      player: this.player, session: this.sid,
      lv: row.lv, attempt: row.try, result: row.res,
      dur: row.dur, left_s: row.left, moves: row.moves, jams: row.jams,
      stars: row.st, load: row.load,
      b_scissors: row.b.scissors, b_wand: row.b.wand,
      b_hammer: row.b.hammer, b_clock: row.b.clock
    });
    this.save();
    this.flush();
  },

  /* Rows that fail to send stay queued and go out on the next attempt or the
     next time the game opens, so a dropped connection never loses a playtest. */
  flush(){
    if (!SUPABASE_URL || !SUPABASE_KEY || !this.queue.length || this.sending) return;
    this.sending = true;
    const batch = this.queue.slice(0, 25);
    // accept either the project URL or the full REST endpoint
    const base = SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
    fetch(base + '/rest/v1/plays', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type':'application/json', apikey: SUPABASE_KEY,
                 Authorization: 'Bearer ' + SUPABASE_KEY, Prefer: 'return=minimal' },
      body: JSON.stringify(batch)
    }).then(r => {
      this.sending = false;
      if (r.ok){ this.queue = this.queue.slice(batch.length); this.save(); this.flush(); }
    }).catch(() => { this.sending = false; });
  }
};

let LEVEL = LEVELS[0];
const TAB = 1, SOCKET = -1, FLAT = 0;
const D = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0] };
const OPP = { U:'D', D:'U', L:'R', R:'L' };


const state = { idx:0, present:new Set(), V:null, H:null, nails:{}, bombs:{}, drag:null, cell:0,
                moves:0, jams:0, time:0, timer:null, armed:null, over:false, best:{},
                used:{scissors:0,wand:0,hammer:0,clock:0}, try:1 };

const key = (x,y) => x+','+y;

/* ---------------------------------------------------------- edge profile */
/* A loose joint (0) is drawn FLAT on both sides: no knob, no hollow, just a
   straight seam. So the shape itself tells the player what is locked - a knob
   means the pair catches, a straight seam means it slides. Collision is
   unchanged, since flat and hollow both fail to catch.                      */

function edgeOf(x, y, side){
  let v;
  if (side === 'L'){ if (x === 0)         return FLAT; v = state.V[y][x];   }
  if (side === 'R'){ if (x === LEVEL.w-1) return FLAT; v = state.V[y][x+1]; }
  if (side === 'U'){ if (y === 0)         return FLAT; v = state.H[y][x];   }
  if (side === 'D'){ if (y === LEVEL.h-1) return FLAT; v = state.H[y+1][x]; }
  if (v === 0) return FLAT;
  if (side === 'L' || side === 'U') return v === -1 ? TAB : SOCKET;
  return v === 1 ? TAB : SOCKET;
}
function catches(home, side, nx, ny){
  return !(edgeOf(home[0],home[1],side) <= 0 && edgeOf(nx,ny,OPP[side]) <= 0);
}

/* ----------------------------------------------------------- travel rule */
/* A piece is a LIST of cells, so a lone tile and a chained pair are the same
   thing to everything below. A chained pair is rigid: both halves move at
   once, so both need a clear corridor in the same direction at the same
   time. That is what makes a distant chain hard.                          */

function occupancy(){
  const m = new Map();
  for (const i of state.present)
    for (const c of LEVEL.pieces[i]) m.set(key(c[0],c[1]), i);
  return m;
}
const onBoard = p => p[0] >= 0 && p[0] < LEVEL.w && p[1] >= 0 && p[1] < LEVEL.h;

/* A sealed side is not the whole edge: only the listed lanes are wall. A body
   is stopped if a wall segment sits in front of ANY of its cells. */
function laneBlocked(cells, dir){
  const lanes = LEVEL.sealed && LEVEL.sealed[dir];
  if (!lanes || !lanes.length) return false;
  const i = (dir === 'U' || dir === 'D') ? 0 : 1;
  return cells.some(c => lanes.indexOf(c[i]) !== -1);
}

function travelLimit(idx, dir, occ){
  occ = occ || occupancy();
  const [dx,dy] = D[dir], perp = dx !== 0 ? ['U','D'] : ['L','R'];
  const cells = LEVEL.pieces[idx];
  let k = 0, lastFull = 0;
  while (true){
    const at = cells.map(c => [c, [c[0]+dx*k, c[1]+dy*k]]);
    if (at.every(a => !onBoard(a[1]))){
      // Wall segment in the way: the body slides up against it and stops.
      if (laneBlocked(cells, dir))
        return { cells:lastFull, exit:false, hard:true };
      return { cells:k-1, exit:true };
    }
    if (at.every(a => onBoard(a[1]))) lastFull = k;
    const here = new Set(at.map(a => key(a[1][0], a[1][1])));

    for (const [, p] of at){                      // cells it moves into
      if (!onBoard(p) || k === 0) continue;
      const o = occ.get(key(p[0],p[1]));
      if (o !== undefined && o !== idx)
        return { cells:Math.max(0,k-1), exit:false, blocker:o, hard:true };
    }
    for (const [home, p] of at){                  // nothing may shear past
      if (!onBoard(p)) continue;
      for (const s of perp){
        const n = [p[0]+D[s][0], p[1]+D[s][1]];
        if (here.has(key(n[0],n[1]))) continue;
        const o = occ.get(key(n[0],n[1]));
        if (o !== undefined && o !== idx && catches(home, s, n[0], n[1]))
          return { cells:Math.max(0,k-1), exit:false, blocker:o, hard:false };
      }
    }
    k++;
  }
}

const exitDirs = (idx, occ) => Object.keys(D).filter(d => travelLimit(idx, d, occ).exit);

function freePieces(){
  const occ = occupancy();
  return [...state.present].filter(i => exitDirs(i, occ).length);
}

/* Removing a piece never blocks another, so greedy decides solvability. */
function solvable(){
  const p = new Set(state.present);
  while (p.size){
    let moved = false;
    for (const i of p){
      const occ = new Map();
      for (const j of p) for (const c of LEVEL.pieces[j]) occ.set(key(c[0],c[1]), j);
      if (Object.keys(D).some(d => travelLimit(i, d, occ).exit)){ p.delete(i); moved = true; break; }
    }
    if (!moved) return false;
  }
  return true;
}

/* ------------------------------------------------------------ piece art */

const R = 18, OFF = 8, PAD = 32;
const KNOB = { U:{tab:[50,-OFF],socket:[50,OFF]}, D:{tab:[50,100+OFF],socket:[50,100-OFF]},
               L:{tab:[-OFF,50],socket:[OFF,50]}, R:{tab:[100+OFF,50],socket:[100-OFF,50]} };

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0,Math.min(255,Math.round(amt>0 ? v+(255-v)*amt : v*(1+amt))));
  return '#'+((1<<24)+(f((n>>16)&255)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
}

function cellSVG(x, y, id, base){
  let add='', cut='';
  for (const s of ['U','R','D','L']){
    const e = edgeOf(x,y,s);
    if (e === TAB){    const [cx,cy]=KNOB[s].tab;    add += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>`; }
    if (e === SOCKET){ const [cx,cy]=KNOB[s].socket; cut += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#000"/>`; }
  }
  const box = `x="${-PAD}" y="${-PAD}" width="${100+2*PAD}" height="${100+2*PAD}"`;
  const px = state.cell*(100+2*PAD)/100;
  return `<svg viewBox="${-PAD} ${-PAD} ${100+2*PAD} ${100+2*PAD}" width="${px}" height="${px}">
    <defs>
      <mask id="m${id}" maskUnits="userSpaceOnUse" ${box}>
        <rect x="0" y="0" width="100" height="100" fill="#fff"/>${add}${cut}</mask>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${shade(base,.44)}"/>
        <stop offset="1" stop-color="${shade(base,-.22)}"/></linearGradient>
      <radialGradient id="s${id}" cx="30%" cy="18%" r="56%">
        <stop offset="0"   stop-color="#fff" stop-opacity=".46"/>
        <stop offset=".55" stop-color="#fff" stop-opacity=".05"/>
        <stop offset="1"   stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <g transform="translate(50,50) scale(1.088) translate(-50,-50)">
      <rect ${box} fill="#ffffff" opacity=".84" mask="url(#m${id})"/></g>
    <g transform="translate(50,50) scale(1.032) translate(-50,-50)">
      <rect ${box} fill="${shade(base,-.5)}" mask="url(#m${id})"/></g>
    <rect ${box} fill="url(#g${id})" mask="url(#m${id})"/>
    <rect ${box} fill="url(#s${id})" mask="url(#m${id})"/>
  </svg>`;
}

/* The chain is the whole obstacle, so draw it boldly: a dark cable with
   bright links riding on it, running between the two halves. */
/* A hub sits at the exact midpoint with a cable running to each half, so it
   reads at a glance which two blocks are tied together. When a board carries
   more than one chain each gets its own colour, otherwise two crossing cables
   are impossible to tell apart. */
const CHAIN_COLORS = ['#ffcc4d', '#5fe0d0', '#ff8fb8', '#9ecbff'];

function chainSVG(a, b, tint){
  const S = state.cell;
  const x1=(a[0]+.5)*S, y1=(a[1]+.5)*S, x2=(b[0]+.5)*S, y2=(b[1]+.5)*S;
  const ang = Math.atan2(y2-y1, x2-x1)*180/Math.PI;
  const disc = S*.33;                       // the ring mounted on each piece

  // Links run between the two discs. The cable is drawn first so the discs
  // sit on top of it and read as the anchor points.
  const len = Math.hypot(x2-x1, y2-y1);
  const inner = len - disc*2;
  const n = Math.max(2, Math.round(inner/(S*.30)));
  let links = '';
  for (let i=0; i<n; i++){
    const t = (disc + inner*(i+.5)/n) / len;
    const cx = x1+(x2-x1)*t, cy = y1+(y2-y1)*t;
    links += `<ellipse cx="${cx}" cy="${cy}" rx="${S*.135}" ry="${S*.088}"
      transform="rotate(${ang} ${cx} ${cy})" fill="none"
      stroke="${i%2 ? '#ffffff' : tint}" stroke-width="${S*.055}"/>`;
  }

  const ring = (cx,cy) => `
    <circle cx="${cx}" cy="${cy}" r="${disc*1.34}" fill="#0d1a20" opacity=".38"/>
    <circle cx="${cx}" cy="${cy}" r="${disc*1.20}" fill="${tint}" opacity=".30"/>
    <circle cx="${cx}" cy="${cy}" r="${disc}" fill="#3a4c57" stroke="${tint}" stroke-width="${S*.095}"/>
    <circle cx="${cx}" cy="${cy}" r="${disc*.46}" fill="${tint}"/>
    <circle cx="${cx-disc*.27}" cy="${cy-disc*.31}" r="${disc*.19}" fill="#fff" opacity=".6"/>`;

  return `<svg class="chain" width="100%" height="100%">
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#16242b"
      stroke-width="${S*.15}" stroke-linecap="round" opacity=".6"/>
    ${links}
    ${ring(x1,y1)}${ring(x2,y2)}
  </svg>`;
}

/* --------------------------------------------------------------- render */

function sizeCell(){
  const availW = window.innerWidth - 38;
  const availH = window.innerHeight - 262;
  return Math.floor(Math.min(availW/LEVEL.w, availH/LEVEL.h, 78));
}
function render(dealIn){
  const S = state.cell = sizeCell();
  board.style.width = (LEVEL.w*S)+'px'; board.style.height = (LEVEL.h*S)+'px';
  board.innerHTML = '';
  for (let y=0;y<LEVEL.h;y++) for (let x=0;x<LEVEL.w;x++){
    const d = document.createElement('div'); d.className='slot';
    d.style.cssText=`left:${x*S}px;top:${y*S}px;width:${S}px;height:${S}px`;
    board.appendChild(d);
  }
  const t = Math.max(7, S*0.16), W = LEVEL.w*S, Hh = LEVEL.h*S, ov = S*.06;
  for (const s in (LEVEL.sealed || {})){
    for (const lane of LEVEL.sealed[s]){
      const d = document.createElement('div'); d.className = 'wall';
      d.style.cssText =
        s === 'U' ? `left:${lane*S-ov}px;top:${-t*1.5}px;width:${S+ov*2}px;height:${t}px` :
        s === 'D' ? `left:${lane*S-ov}px;top:${Hh+t*.5}px;width:${S+ov*2}px;height:${t}px` :
        s === 'L' ? `left:${-t*1.5}px;top:${lane*S-ov}px;width:${t}px;height:${S+ov*2}px` :
                    `left:${W+t*.5}px;top:${lane*S-ov}px;width:${t}px;height:${S+ov*2}px`;
      board.appendChild(d);
    }
  }
  let chainNo = 0;
  LEVEL.pieces.forEach((cells,i) => {
    if (!state.present.has(i)) return;
    const el = document.createElement('div');
    el.className = 'pc' + (cells.length > 1 ? ' chained' : '');
    el.dataset.i = i;
    cells.forEach((c, ci) => {
      const w = document.createElement('div');
      w.className = 'cw';
      w.style.left = (c[0]*S - S*PAD/100)+'px';
      w.style.top  = (c[1]*S - S*PAD/100)+'px';
      w.innerHTML = cellSVG(c[0], c[1], i+'_'+ci, colorOf(c));
      el.appendChild(w);
    });
    // chain last, so its rings sit ON the two pieces rather than under them
    if (cells.length > 1)
      el.insertAdjacentHTML('beforeend',
        chainSVG(cells[0], cells[1], CHAIN_COLORS[chainNo++ % CHAIN_COLORS.length]));
    if (dealIn){
      el.classList.add('deal');
      el.style.animationDelay = ((cells[0][0]+cells[0][1])*22)+'ms';
      el.addEventListener('animationend', () => el.classList.remove('deal'), { once:true });
    }
    board.appendChild(el);
  });
  document.getElementById('left').textContent = state.present.size;
  if (state.armed === 'scissors') showJoints();
  paintNails();
  paintBombs();
  drawTutorial();
}

/* ------------------------------------------------------------------ drag */

const MIN_SWIPE=7, GIVE_SOFT=.30, GIVE_HARD=.07;

board.addEventListener('pointerdown', e => {
  if (state.over) return;
  if (state.drag) endDrag();                    // never leave a stale drag open
  const el = e.target.closest('.pc');
  if (state.armed === 'hammer' && el){ useHammer(el); return; }
  if (state.armed || !el) return;
  const idx = +el.dataset.i;
  if (nailAt(idx) > 0){                         // pinned: refuse and say so
    el.classList.remove('clang'); void el.offsetWidth; el.classList.add('clang');
    state.jams++;
    if (navigator.vibrate) navigator.vibrate(22);
    return;
  }
  // Capture on the cell that was actually hit. The .pc wrapper spans the whole
  // board and is pointer-events:none, so capturing it silently does nothing.
  const hit = e.target.closest('.cw');
  if (hit && hit.setPointerCapture){ try { hit.setPointerCapture(e.pointerId); } catch(_){} }
  el.classList.remove('snap','deal');
  el.classList.add('lift');
  state.drag = { el, id:e.pointerId, idx,
                 sx:e.clientX, sy:e.clientY, axis:null, dir:null, lim:null, off:0, jammed:false };
});

/* These live on the window, not the board: dragging a piece out means the
   finger leaves the board long before the pointer is released, and a pointerup
   the board never hears would strand the drag and lock every later tap. */
window.addEventListener('pointermove', e => {

  const dx = e.clientX-g.sx, dy = e.clientY-g.sy;

                g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
  const raw = g.axis === 'x' ? dx : dy;
  const dir = g.axis === 'x' ? (raw<0?'L':'R') : (raw<0?'U':'D');
  if (dir !== g.dir){ g.dir=dir; g.lim=travelLimit(g.idx,dir); g.jammed=false; clearBlocker(); }
  const S = state.cell;
  const give = g.lim.exit ? 1 : (g.lim.hard ? GIVE_HARD : GIVE_SOFT);
  const maxPx = g.lim.exit ? (g.lim.cells+1.15)*S : (g.lim.cells+give)*S;
  const want = Math.abs(raw), off = Math.min(want, maxPx);
  g.off = off;
  const [ux,uy] = D[dir];
  g.el.style.transform = `translate(${ux*off}px,${uy*off}px)`;
  if (!g.lim.exit && want > maxPx+4 && !g.jammed){
    g.jammed = true; state.jams++; markBlocker(g.lim.blocker);
    if (navigator.vibrate) navigator.vibrate(14);
  }
}, { passive:true });

function endDrag(e){
  const g = state.drag; if (!g || (e && e.pointerId !== g.id)) return;
  state.drag = null; clearBlocker(); g.el.classList.remove('lift');
  const exitPx = g.lim ? (g.lim.cells+1.15)*state.cell : 0;
  if (g.lim && g.lim.exit && g.off >= exitPx*.42) flyOut(g.el, g.idx, g.dir, g.lim.cells);
  else { g.el.classList.add('snap'); g.el.style.transform='translate(0,0)'; }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', () => endDrag());

function flyOut(el, idx, dir, cells){
  const [ux,uy]=D[dir], far=(cells+2.6)*state.cell;
  el.classList.add('fly'); el.style.transform=`translate(${ux*far}px,${uy*far}px)`;
  state.present.delete(idx); state.moves++;
  document.getElementById('left').textContent = state.present.size;
  setTimeout(()=>el.remove(),340); clearTutorial(); tickNails(); tickBombs();
  if (state.present.size === 0) finish(true);
}

/* ---- nails ---------------------------------------------------------------
   A nailed piece cannot be dragged until its counter reaches zero. The
   counter ticks on every successful removal. Measurement put the
   deadlock-free zone at counter <= 40% of piece count; the valve below is
   the safety net for anything that slips past it.                        */

function nailAt(i){ return state.nails[i] || 0; }

function tickNails(){
  for (const k in state.nails) if (state.nails[k] > 0) state.nails[k]--;
  paintNails(true);
  releaseValve();
}

function paintNails(tick){
  board.querySelectorAll('.nail').forEach(n => n.remove());
  board.querySelectorAll('.pc.pinned').forEach(n => n.classList.remove('pinned'));
  const S = state.cell;
  for (const k in state.nails){
    const i = +k, n = state.nails[k];
    if (!state.present.has(i)) continue;
    const pc = board.querySelector(`.pc[data-i="${i}"]`);
    if (n <= 0){
      if (pc && !pc.dataset.freed){ pc.dataset.freed='1'; pc.classList.add('popped'); }
      continue;
    }
    if (pc) pc.classList.add('pinned');
    const [x,y] = LEVEL.pieces[i][0];
    const d = Math.max(22, S*0.46);
    const el = document.createElement('div');
    el.className = 'nail' + (tick ? ' tick' : '');
    el.style.cssText = `left:${(x+.5)*S-d/2}px;top:${(y+.5)*S-d/2}px;width:${d}px;height:${d}px`;
    el.innerHTML = `<span>${n}</span>`;
    board.appendChild(el);
  }
}

/* The counter only ticks on a move, so if every free piece is still pinned
   the board would be dead. Pop the one that has waited longest. */
function releaseValve(){
  const free = freePieces();
  if (!free.length) return;
  if (free.some(i => nailAt(i) <= 0)) return;
  let pick = free[0], low = Infinity;
  for (const i of free){ const n = nailAt(i); if (n < low){ low = n; pick = i; } }
  state.nails[pick] = 0;
  paintNails();
  prompt.textContent = 'Çivi kendiliğinden söktü';
  setTimeout(()=>{ if (prompt.textContent==='Çivi kendiliğinden söktü') prompt.textContent=''; }, 1600);
}

/* ---- bombs ----------------------------------------------------------------
   A fuse burns one step per move. At zero the level is lost. This is the only
   obstacle that breaks "any legal move will do": a specific piece has to be
   reached in time, so the order finally matters.                          */

function paintBombs(tick){
  board.querySelectorAll('.bomb').forEach(n => n.remove());
  const S = state.cell;
  for (const k in state.bombs){
    const i = +k, n = state.bombs[k];
    if (!state.present.has(i)) continue;
    const [x,y] = LEVEL.pieces[i][0];
    const d = Math.max(24, S*0.52);
    const el = document.createElement('div');
    el.className = 'bomb' + (tick ? ' tick' : '') + (n <= 4 ? ' hot' : '');
    el.style.cssText = `left:${(x+.5)*S-d/2}px;top:${(y+.5)*S-d/2}px;width:${d}px;height:${d}px`;
    el.innerHTML = `<i></i><span>${n}</span>`;
    board.appendChild(el);
  }
}

function tickBombs(){
  let blown = false;
  for (const k in state.bombs){
    if (!state.present.has(+k)){ delete state.bombs[k]; continue; }
    state.bombs[k]--;
    if (state.bombs[k] <= 0) blown = true;
  }
  paintBombs(true);
  if (blown) finish(false, 'bomb');
}

function markBlocker(i){ if(i===undefined||i===null)return;
  const el=board.querySelector(`.pc[data-i="${i}"]`); if(el)el.classList.add('blocker'); }
function clearBlocker(){ board.querySelectorAll('.pc.blocker').forEach(n=>n.classList.remove('blocker')); }

/* -------------------------------------------------------------- boosters */

const ICONS = {
  scissors:`<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
      <circle cx="6.4" cy="18.2" r="2.7"/><circle cx="17.6" cy="18.2" r="2.7"/>
      <path d="M8.4 16.3 19.2 3.4"/><path d="M15.6 16.3 4.8 3.4"/>
      <circle cx="12" cy="11.4" r="1" fill="#fff"/></g>`,
  wand:`<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 20.4 13.2 10.8"/>
      <path d="M17 4.2l1.7 3.5 3.8.6-2.8 2.7.7 3.8L17 13l-3.4 1.8.7-3.8-2.8-2.7 3.8-.6z" fill="#fff"/>
      <path d="M6.2 5.6v2.8M4.8 7h2.8"/></g>`,
  hammer:`<g transform="rotate(-38 12 12)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linejoin="round">
      <rect x="5.6" y="3.4" width="12.8" height="5.6" rx="1.6" fill="#fff"/>
      <rect x="10.2" y="9" width="3.6" height="11.6" rx="1.5"/></g>`,
  clock:`<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13.6" r="7.4"/><path d="M12 9.6v4l2.6 1.9"/>
      <rect x="10.2" y="2" width="3.6" height="2.6" rx="1"/>
      <path d="M5 6.6 6.7 8.3M19 6.6 17.3 8.3"/></g>`
};
const INTRO_ICONS = {
  hammer: ICONS.hammer,
  chain: `<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
      <circle cx="6.4" cy="17.6" r="3.2"/><circle cx="17.6" cy="6.4" r="3.2"/>
      <path d="M8.7 15.3 15.3 8.7"/></g>`,
  bomb: `<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
      <circle cx="10.6" cy="14.4" r="6.4"/><path d="M15.4 9.6 18 7"/>
      <path d="M18 7c1-1.6 3-1.6 3.4.4"/><path d="M17.2 4.4v2M20.4 4v1.8"/></g>`,
  wall: `<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="5" width="18" height="14" rx="1.6"/>
      <path d="M3 9.7h18M3 14.3h18M9 5v4.7M15 9.7v4.6M9 14.3V19"/></g>`
};

const BOOSTERS = [
  { id:'scissors', name:'Makas',  count:5,  aim:true,
    hint:'Kesmek istediğin birleşim noktasına dokun' },
  { id:'wand',     name:'Değnek', count:3,  aim:false,
    ask:['Değnek kullanılsın mı?','Tahtadaki tüm çıkıntılar yeniden dizilir. Resim değişmez ama hangi parçaların birbirine kilitli olduğu tamamen değişir.'] },
  { id:'hammer',   name:'Çekiç',  count:7,  aim:true,
    hint:'Kırmak istediğin parçaya dokun' },
  { id:'clock',    name:'Saat',   count:10, aim:false,
    ask:['Saat kullanılsın mı?','Geri sayıma 20 saniye eklenir.'] }
];

function drawBar(){
  document.getElementById('bar').innerHTML = BOOSTERS.map(b => `
    <div class="bst-wrap">
      <button class="bst ${b.count===0?'out':''} ${state.armed===b.id?'on':''}" data-b="${b.id}">
        <svg viewBox="0 0 24 24">${ICONS[b.id]}</svg><span class="badge">${b.count}</span>
      </button>
      <div class="bst-name">${b.name}</div>
    </div>`).join('');
}

document.getElementById('bar').addEventListener('click', e => {
  const btn = e.target.closest('.bst'); if (!btn || state.over) return;
  const b = BOOSTERS.find(x => x.id === btn.dataset.b);
  if (!b || b.count === 0) return;

  if (!b.aim){                                   // wand and clock ask first
    askConfirm(b, () => b.id === 'wand' ? useWand(b) : useClock(b));
    return;
  }
  state.armed = state.armed === b.id ? null : b.id;
  prompt.textContent = state.armed ? b.hint : '';
  drawBar(); clearJoints();
  if (state.armed === 'scissors') showJoints();
});

let askFn = null;
function askConfirm(b, fn){
  askFn = fn;
  document.getElementById('askIc').innerHTML = `<svg viewBox="0 0 24 24">${ICONS[b.id]}</svg>`;
  document.getElementById('askTitle').textContent = b.ask[0];
  document.getElementById('askSub').textContent = b.ask[1] + ` Elinde ${b.count} tane kaldı.`;
  document.getElementById('ask').classList.add('open');
}
document.getElementById('askYes').onclick = () => {
  document.getElementById('ask').classList.remove('open');
  if (askFn) askFn(); askFn = null;
};
document.getElementById('askNo').onclick = () => {
  document.getElementById('ask').classList.remove('open'); askFn = null;
};

function spend(b){ state.used[b.id]++; b.count--; state.armed=null; prompt.textContent=''; clearJoints(); drawBar(); }

/* Scissors: flatten one joint so that pair stops catching. */
function showJoints(){
  const S = state.cell, d = Math.max(14, S*.30), occ = occupancy();
  for (const i of state.present) for (const [x,y] of LEVEL.pieces[i]){
    const r = occ.get(key(x+1,y)), b = occ.get(key(x,y+1));
    if (r !== undefined && r !== i && state.V[y][x+1] !== 0) addJoint((x+1)*S,(y+.5)*S,d,'v',x+1,y);
    if (b !== undefined && b !== i && state.H[y+1][x] !== 0) addJoint((x+.5)*S,(y+1)*S,d,'h',x,y+1);
  }
}
function addJoint(cx,cy,d,kind,ix,iy){
  const n=document.createElement('div'); n.className='joint';
  n.style.cssText=`left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px`;
  n.onclick = ev => { ev.stopPropagation();
    if (kind==='v') state.V[iy][ix]=0; else state.H[iy][ix]=0;
    spend(BOOSTERS[0]); render(); };
  board.appendChild(n);
}
function clearJoints(){ board.querySelectorAll('.joint').forEach(n=>n.remove()); }

/* Wand: reshuffle which side owns each tab, keeping the board solvable. */
function useWand(b){
  const V0=JSON.stringify(state.V), H0=JSON.stringify(state.H);
  for (let t=0;t<200;t++){
    state.V=JSON.parse(V0); state.H=JSON.parse(H0);
    for (let y=0;y<LEVEL.h;y++) for (let x=1;x<LEVEL.w;x++)
      if (state.V[y][x]!==0) state.V[y][x] = Math.random()<.5?1:-1;
    for (let y=1;y<LEVEL.h;y++) for (let x=0;x<LEVEL.w;x++)
      if (state.H[y][x]!==0) state.H[y][x] = Math.random()<.5?1:-1;
    if (solvable()){ spend(b); render(); return; }
  }
  state.V=JSON.parse(V0); state.H=JSON.parse(H0);
  prompt.textContent = 'Değnek yeni bir dizilim bulamadı, hakkın harcanmadı';
}
function useHammer(el){
  const idx = +el.dataset.i;
  spend(BOOSTERS[2]);
  el.classList.add('fly');
  el.style.transform = `translate(0,${-2.6*state.cell}px)`;
  state.present.delete(idx); state.moves++;
  document.getElementById('left').textContent = state.present.size;
  setTimeout(()=>el.remove(),340); clearTutorial(); tickNails(); tickBombs();
  if (state.present.size === 0) finish(true);
}
function useClock(b){
  state.used.clock++;
  state.time += 20; b.count--; drawBar(); tickDisplay();
  prompt.textContent='+20 saniye';
  setTimeout(()=>{ if (prompt.textContent==='+20 saniye') prompt.textContent=''; },1200);
}

/* ----------------------------------------------------------------- clock */

function tickDisplay(){
  const c = document.getElementById('clock');
  const t = Math.max(0, state.time);
  c.textContent = `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  c.classList.toggle('warn', t <= 20);
}
function startClock(){
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    if (state.over) return;
    state.time--; tickDisplay();
    if (state.time <= 0) finish(false);
  }, 1000);
}

/* ------------------------------------------------------------------ flow */

function starSVG(on){
  return `<svg viewBox="0 0 24 24" class="${on?'':'off'}">
    <path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.05 1.1-6.5-4.7-4.6 6.5-.95z"
      fill="${on?'#f0a742':'#ffffff'}"/></svg>`;
}

// Stars come from how much clock is left, which is exactly the signal we want
// back from testers: it tells us whether the timer headroom was right.
function starsFor(){
  const frac = state.time / LEVEL.timer;
  return frac >= .45 ? 3 : frac >= .2 ? 2 : 1;
}

function finish(won, why){
  state.over = true; clearInterval(state.timer);
  LOG.record({ lv:LEVEL.lv, try:state.try, res: won ? 'win' : (why || 'time'),
               dur: LEVEL.timer - state.time, left: Math.max(0,state.time),
               moves: state.moves, jams: state.jams,
               st: won ? starsFor() : 0, load: LEVEL.load, b: {...state.used} });
  const stars = won ? starsFor() : 0;
  if (won) state.best[LEVEL.lv] = Math.max(state.best[LEVEL.lv]||0, stars);
  document.getElementById('vTitle').textContent =
    won ? 'Tahta boşaldı' : (why === 'bomb' ? 'Bomba patladı' : 'Süre doldu');
  document.getElementById('vStars').innerHTML = [1,2,3].map(n => starSVG(n <= stars)).join('');
  document.getElementById('vSub').textContent =
    won  ? `${state.time} saniye kaldı, ${state.jams} kez takıldın.`
    : why === 'bomb' ? 'Fitil bitmeden bombanın yolunu açman gerekiyordu. Çekiç onu tek hamlede söker.'
    : `${state.present.size} gövde kaldı. Saat booster'ı 20 saniye ekler.`;
  const next = document.getElementById('vBtn');
  next.textContent = won
    ? (state.idx < LEVELS.length-1 ? 'Sonraki bölüm' : 'Tebrikler, 40 bölüm bitti')
    : 'Tekrar dene';
  next.dataset.act = won ? (state.idx < LEVELS.length-1 ? 'next' : 'stay') : 'retry';
  document.getElementById('veil').classList.add('open');
}

function loadLevel(i, skipIntro){
  // an abandoned attempt is data too: it usually means the level was too hard
  if (state.level_started && !state.over && state.moves > 0){
    LOG.record({ lv:LEVEL.lv, try:state.try, res:'quit',
                 dur: LEVEL.timer - state.time, left: Math.max(0,state.time),
                 moves: state.moves, jams: state.jams, st:0,
                 load: LEVEL.load, b: {...state.used} });
  }
  state.idx = Math.max(0, Math.min(LEVELS.length-1, i));
  LEVEL = LEVELS[state.idx];
  state.present = new Set(LEVEL.pieces.map((_,i) => i));
  state.V = JSON.parse(JSON.stringify(LEVEL.vEdge));
  state.H = JSON.parse(JSON.stringify(LEVEL.hEdge));
  state.nails = {};
  for (const k in LEVEL.nails) state.nails[+k] = LEVEL.nails[k];
  state.bombs = {};
  for (const k in LEVEL.bombs) state.bombs[+k] = LEVEL.bombs[k];
  state.moves = 0; state.jams = 0; state.armed = null;
  state.time = LEVEL.timer; state.over = false;
  tutDone = false;
  prompt.textContent = '';
  BOOSTERS[0].count=5; BOOSTERS[1].count=3; BOOSTERS[2].count=7; BOOSTERS[3].count=10;
  document.getElementById('veil').classList.remove('open');
  document.getElementById('ask').classList.remove('open');
  document.getElementById('selVeil').classList.remove('open');
  document.getElementById('lvNum').textContent = LEVEL.lv;
  drawBar(); tickDisplay(); render(true);

  if (LEVEL.intro && !skipIntro){
    clearInterval(state.timer);
    document.getElementById('introIc').innerHTML =
      `<svg viewBox="0 0 24 24">${INTRO_ICONS[LEVEL.intro.icon] || ICONS.hammer}</svg>`;
    document.getElementById('introTitle').textContent = LEVEL.intro.title;
    document.getElementById('introBody').textContent  = LEVEL.intro.body;
    document.getElementById('introTip').textContent   = LEVEL.intro.tip || '';
    document.getElementById('introVeil').classList.add('open');
  } else {
    startClock();
  }
}

document.getElementById('introBtn').onclick = () => {
  document.getElementById('introVeil').classList.remove('open');
  startClock();
};

document.getElementById('vBtn').onclick = () => {
  const act = document.getElementById('vBtn').dataset.act;
  if (act === 'next') loadLevel(state.idx + 1);
  else if (act === 'retry') loadLevel(state.idx, true);
  else openSelect();
};
document.getElementById('vRetry').onclick = () => loadLevel(state.idx, true);
document.getElementById('resetBtn').onclick = () => loadLevel(state.idx, true);

/* level select, so a tester can jump straight to the level being reviewed */
function openSelect(){
  document.getElementById('selGrid').innerHTML = LEVELS.map((L,i) => {
    const s = state.best[L.lv] || 0;
    return `<div class="sel ${s?'done':''} ${i===state.idx?'now':''}" data-i="${i}">${L.lv}</div>`;
  }).join('');
  document.getElementById('selVeil').classList.add('open');
}
document.getElementById('lvBtn').onclick = openSelect;
document.getElementById('selClose').onclick = () =>
  document.getElementById('selVeil').classList.remove('open');
document.getElementById('selGrid').onclick = e => {
  const t = e.target.closest('.sel');
  if (t) loadLevel(+t.dataset.i);
};

/* ------------------------------------------------------- results sharing */

function resultText(){
  const byLv = {};
  for (const r of LOG.rows){
    const a = byLv[r.lv] = byLv[r.lv] || { tries:0, dur:0, jams:0, left:0, st:0,
                                           b:{scissors:0,wand:0,hammer:0,clock:0}, res:[] };
    a.tries++; a.dur += r.dur; a.jams += r.jams;
    if (r.res === 'win'){ a.left = r.left; a.st = r.st; }
    a.res.push(r.res[0]);
    for (const k in r.b) a.b[k] += r.b[k];
  }
  let out = 'REVERSE SOLVER ' + (LOG.player || '?') + ' (' + LOG.sid + ')\n';
  out += 'lv|deneme|sonuc|sure|kalan|yildiz|takilma|makas|degnek|cekic|saat\n';
  Object.keys(byLv).sort(function(a,b){return a-b;}).forEach(function(lv){
    const a = byLv[lv];
    out += [lv, a.tries, a.res.join(''), a.dur, a.left, a.st, a.jams,
            a.b.scissors, a.b.wand, a.b.hammer, a.b.clock].join('|') + '\n';
  });
  return out;
}

function openResults(){
  const played = new Set(LOG.rows.map(function(r){return r.lv;})).size;
  const wins = new Set(LOG.rows.filter(function(r){return r.res==='win';})
                               .map(function(r){return r.lv;})).size;
  document.getElementById('resSum').textContent =
    played + ' bolum denendi, ' + wins + ' tanesi gecildi, ' +
    LOG.rows.length + ' deneme kaydedildi. Metni kopyalayip gonder.';
  document.getElementById('resWa').href =
    'https://wa.me/?text=' + encodeURIComponent(resultText());
  document.getElementById('resVeil').classList.add('open');
}
document.getElementById('selResults').onclick = openResults;
document.getElementById('resClose').onclick = function(){
  document.getElementById('resVeil').classList.remove('open'); };
document.getElementById('resCopy').onclick = function(){
  const t = resultText(), btn = document.getElementById('resCopy');
  const done = function(){ btn.textContent = 'Kopyalandi';
    setTimeout(function(){ btn.textContent = 'Kopyala'; }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done);
  else { const b = document.getElementById('resBox');
         b.style.display = 'block'; b.textContent = t; }
};

/* ------------------------------------------------------------- name gate */

function boot(){
  if (LOG.player){ loadLevel(0); return; }
  document.getElementById('nameVeil').classList.add('open');
}
document.getElementById('nameGo').onclick = function(){
  const v = document.getElementById('nameIn').value.trim();
  if (!v) return;
  LOG.player = v; LOG.save();
  document.getElementById('nameVeil').classList.remove('open');
  loadLevel(0);
};
document.getElementById('nameIn').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('nameGo').click();
});

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 130); });
boot();
</script>
